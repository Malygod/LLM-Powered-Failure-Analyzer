name: Causelab checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracehaven
          POSTGRES_PASSWORD: tracehaven_test
          POSTGRES_DB: tracehaven_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracehaven"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt ./sdk
      - run: PYTHONPATH=backend:sdk pytest -q backend/tests sdk/tests
      - run: alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql://tracehaven:tracehaven_test@localhost:5432/tracehaven_test
      - run: PYTHONPATH=backend python -m app.seed seed_data.json
        env:
          DATABASE_URL: postgresql://tracehaven:tracehaven_test@localhost:5432/tracehaven_test
      - run: PYTHONPATH=backend pytest -q backend/tests/test_postgres.py
        env:
          TEST_POSTGRES_URL: postgresql://tracehaven:tracehaven_test@localhost:5432/tracehaven_test
      - run: python scripts/build_demo.py && git diff --exit-code -- seed_data.json frontend/src/lib/recorded.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
