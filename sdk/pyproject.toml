[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent-sdk"
version = "0.1.0"
description = "Small, non-disruptive Python tracing client for OMNI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["omni*", "causelab*", "tracehaven*"]
