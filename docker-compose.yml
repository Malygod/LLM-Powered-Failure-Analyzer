services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracehaven
      POSTGRES_PASSWORD: tracehaven_local
      POSTGRES_DB: tracehaven
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracehaven"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://tracehaven:tracehaven_local@db:5432/tracehaven
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: &backend_environment
      DATABASE_URL: postgresql://tracehaven:tracehaven_local@db:5432/tracehaven
      LIVE_ENABLED: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
